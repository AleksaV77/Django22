{% extends 'catalog/home.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Удалить продукт {{ object.title }}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-primary">Удалить</button>
                    <a href="{% url 'catalog:home'%}" class="btn btn-secondary my-2">Отменить</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
