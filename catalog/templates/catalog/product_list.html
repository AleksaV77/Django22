{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.img | media_filter }}" style="max-width: 80%; height: 280px;">
                    <div class="card-body">
                        <p class="card-text">{{ product.product_name }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary my-2" href="{% url 'catalog:product_detail' product.pk %}" role="button">Посмотреть</a>
                                <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-secondary my-2">Редактировать</a>
                                <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-secondary my-2">Удалить</a>
                            </div>
                            <small class="text-body-secondary">9 mins</small>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
