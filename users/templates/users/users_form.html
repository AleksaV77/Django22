{% extends 'catalog/home.html' %}
{% block title %}Регистация{% endblock %}
{% block content %}
<h2>Регистация</h2>
<div class="container">
    <div class="row">
        <div class="col-9">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">Регистация</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
